# FOREWARN IBF Portal — production nginx on the model VM.
#
# Goes in /etc/nginx/sites-available/ and symlinked into sites-enabled/.
# The existing ccm-dashboard config on :8088 stays exactly as it is — this
# file sits in front of it and does not modify it.
#
#   /            -> the portal frontend
#   /api/        -> the portal backend
#   /ccm/        -> the CCM model screen, already running on :8088
#   /websockify  -> the live VNC stream behind that screen
#
# Replace ibf.example.org with the real hostname before enabling.

server {
    listen 80;
    server_name ibf.example.org;

    # Large uploads (cyclone inputs, boundary files)
    client_max_body_size 200M;

    # ---------------------------------------------------------------- portal
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }
    location /docs           { proxy_pass http://127.0.0.1:8000/docs; }

    # ------------------------------------------------------------- CCM model
    # The trailing slash on proxy_pass strips the /ccm prefix, so the dashboard
    # sees requests at its own root — which is what it was built for.
    location /ccm/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The dashboard requests /websockify as an absolute path, so it must be
    # served at the portal's root too — not under /ccm/. This is the live VNC
    # stream, so it needs the WebSocket upgrade headers and long timeouts.
    location /websockify {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # VNC is long-lived; don't drop idle sessions
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
