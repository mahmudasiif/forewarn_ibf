[project]
name = "forewarn-api"
version = "0.1.0"
description = "FOREWARN IBF Portal — core API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "pyshp>=2.3",
  "passlib[bcrypt]>=1.7",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "boto3>=1.35",
  "celery>=5.4",
  "redis>=5.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
