server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are content-addressed, so cache them hard. This block is
    # first so it wins for JS/CSS/etc. (nginx prefers a regex match over the
    # prefix `location /` below).
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the un-hashed entry point — never let a browser serve it
    # from cache without revalidating, or a new deploy's bundle is never picked
    # up (heuristic caching kicks in when no Cache-Control is set).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
