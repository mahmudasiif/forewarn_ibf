# Replace ibf.example.org with the real domain before go-live.
server {
    listen 80;
    server_name ibf.example.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ibf.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs      { proxy_pass http://api:8000/docs; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # Dashboard (static build served by the web container)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
