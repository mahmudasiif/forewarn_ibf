# FOREWARN IBF Portal — host nginx vhost on the model VM.
#
#   sudo cp forewarn-portal.conf /etc/nginx/sites-available/forewarn-portal
#   sudo ln -s /etc/nginx/sites-available/forewarn-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This ADDS a site. It does not touch `default` or `ccm-dashboard`, both of
# which stay exactly as they are. CCM keeps serving on :8088 for anyone who
# uses it directly; this file simply also exposes it under /ccm/ so the portal
# can frame it on the same origin.
#
# Until a domain exists, this listens on :8080 so it cannot fight the existing
# default_server on :80. Once DNS is pointed here, change to `listen 80;` and
# set the real server_name — see Documents/13-vm-deployment.md.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 200M;

    access_log /var/log/nginx/forewarn-portal.access.log;
    error_log  /var/log/nginx/forewarn-portal.error.log;

    # ---------------------------------------------------------- portal (SPA)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ portal API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /openapi.json { proxy_pass http://127.0.0.1:8001/openapi.json; }
    location /docs           { proxy_pass http://127.0.0.1:8001/docs; }

    # ------------------------------------------------------------- CCM model
    # Trailing slash strips the /ccm prefix, so the dashboard sees its own root.
    location /ccm/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The dashboard asks for /websockify as an absolute path, so it has to be
    # served at this vhost's root too. This is the live VNC stream: it needs
    # the upgrade headers and long timeouts, same as the :8088 site uses.
    location /websockify {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
