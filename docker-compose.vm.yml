# Standalone production compose for the FOREWARN model VM (10.71.1.102).
#
# This file is NOT an overlay merged with docker-compose.yml — it fully
# defines every service on its own. It was originally written as an overlay
# (`-f docker-compose.yml -f docker-compose.vm.yml`), using the Compose merge
# tags `!reset`/`!override` to clear the base file's dev-only ports and
# commands. Twice, that produced an empty `ports:` for every affected
# service instead of the intended value — api, web, minio and ccm all came
# out with no port published to the host at all, which would have made the
# whole deployment unreachable. Rather than keep chasing why the merge tags
# behaved that way, this file drops merging entirely: what's written here is
# exactly what runs on the VM, nothing inherited, nothing to accidentally
# lose in a merge.
#
# Run with:
#   docker compose -f docker-compose.vm.yml up -d --build
#
# Local dev is untouched by this — `make up` / plain `docker compose up`
# only ever reads docker-compose.yml, never this file.

name: forewarn-ibf

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # No ports: — internal only. The VM already has its own Postgres on 5432.

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    restart: always
    # No ports: — internal only. The VM already has its own Redis on 6379.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9100:9000"   # API
      - "127.0.0.1:9101:9001"   # console, localhost only
    volumes: [minio-data:/data]
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: prod
    env_file: [.env]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data:ro         # the CCM cyclone database
      - prep-runs:/runs:ro      # shared with worker/preparedness for on-demand area maps
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
    restart: always

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      - ./data:/data:ro
      - prep-runs:/runs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: celery -A app.celery_app worker -l info
    restart: always

  beat:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on: [redis]
    command: celery -A app.celery_app beat -l info
    restart: always
    # No dev bind mount and no data mount — beat only schedules jobs, it
    # doesn't need the source tree or the cyclone data at runtime.

  ccm:
    build:
      context: ./services/ccm
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      - ./services/ccm/weights:/app/weights:ro
    restart: always
    # No ports: — the portal's model-service stub; not public.

  preparedness:
    build:
      context: ./services/preparedness
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      - ./services/preparedness/assets:/app/assets:ro
      - prep-runs:/runs
    restart: always
    # No ports: — internal model service, reached only by the worker.

  dfrm:
    build:
      context: ./services/dfrm
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      - ./services/dfrm/assets:/app/assets:ro
    restart: always
    # No ports: — internal model service, reached only by the API.

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: prod
      args:
        # Baked in at build time — Vite inlines these into the bundle, so they
        # must be set here and not in the container environment. Both are
        # relative paths because the host nginx serves everything on one origin.
        VITE_API_BASE_URL: /api/v1
        VITE_CCM_DASHBOARD_URL: /ccm/
    env_file: [.env]
    ports:
      - "127.0.0.1:5174:80"
    restart: always
    # No command: — target: prod is a plain nginx image; it runs its own
    # CMD from the Dockerfile, not a dev server.

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prep-runs:
