# Production overlay for the FOREWARN model VM (10.71.1.102).
#
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
#
# Two things make this different from the generic prod overlay:
#
# 1. The VM already runs nginx on :80 and already has PostgreSQL, Redis and
#    MySQL on localhost. Publishing our own copies on the default ports would
#    collide with them. So nothing here publishes a default port, and the
#    database, cache and object store are not published at all — they are
#    reachable only from inside the compose network.
#
# 2. The VM's own nginx is the single front door. We do NOT run an nginx
#    container. Our two web-facing services bind to 127.0.0.1 on unusual
#    ports, and the host nginx proxies to them. The existing default and
#    ccm-dashboard sites are left untouched.
#
# IMPORTANT: Compose merges list fields (ports, volumes) across -f files by
# APPENDING, not replacing — a plain `ports: []` here does nothing, the base
# file's ports are still there underneath it. Two merge tags fix that, and
# they are NOT interchangeable:
#   - `!reset` clears a field to empty and ignores anything written after it.
#     Use it only where the field should end up with nothing at all.
#   - `!override` replaces the base value outright with the value given here.
#     Use it everywhere we provide an actual replacement list.
# Mixing them up (e.g. `!reset` followed by a real list) silently drops the
# list — the field just comes out empty. Verify with
# `docker compose -f docker-compose.yml -f docker-compose.vm.yml config`
# after touching this file, and check the field actually has the value
# you expect, not just that the command didn't error.

name: forewarn-ibf

services:
  db:
    ports: !reset []    # internal only — the VM already has Postgres on 5432
    restart: always

  redis:
    ports: !reset []    # internal only — the VM already has Redis on 6379
    restart: always

  minio:
    ports: !override
      - "127.0.0.1:9100:9000"   # API
      - "127.0.0.1:9101:9001"   # console, localhost only
    restart: always

  api:
    build:
      target: prod
    ports: !override
      - "127.0.0.1:8001:8000"
    volumes: !override
      - ./data:/data:ro         # the CCM cyclone database
    restart: always
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000

  worker:
    volumes: !override
      - ./data:/data:ro
    restart: always

  beat:
    volumes: !reset []
    restart: always

  ccm:
    ports: !reset []    # the portal's model-service stub; not public
    volumes: !override
      - ./services/ccm/weights:/app/weights:ro
    restart: always

  web:
    build:
      target: prod
      args:
        # Baked in at build time — Vite inlines these into the bundle, so they
        # must be set here and not in the container environment. Both are
        # relative paths because the host nginx serves everything on one origin.
        VITE_API_BASE_URL: /api/v1
        VITE_CCM_DASHBOARD_URL: /ccm/
    ports: !override
      - "127.0.0.1:5174:80"
    volumes: !reset []
    # The base file's `command: npm run dev ...` is for the dev target and has
    # no npm to run against here — target: prod is a plain nginx image. A
    # scalar field like `command` IS replaced by an override (unlike ports/
    # volumes it doesn't need a tag), so a literal `null` unsets it and falls
    # back to the image's own nginx CMD.
    command: null
    restart: always
